// FUNCTION SAVE TASK
//======================================

function saveTask(){

    // Vérification du formulaire

    let taskForm = document.getElementById("taskForm");

    if(!taskForm.reportValidity()){
        return;
    }

    // Lecture des champs du formulaire

    let titleTask = document.getElementById("titleTask").value;
    let descriptionTask = document.getElementById("descriptionTask").value;
    let cv = document.getElementById("cv").value;
    let dateDebut = document.getElementById("dateDebut").value;
    let dateFin = document.getElementById("dateFin").value;
    let idCategory = Number(document.getElementById("idCategory").value);
    let idStatus = Number(document.getElementById("idStatus").value);
    let idPhaseRealisation = Number(document.getElementById("idPhaseRealisation").value);
    let idPriority = Number(document.getElementById("idPriority").value);

    // Récupération de TaskList depuis Local Storage

    let TaskListDataStr = localStorage.getItem("TaskList");

    let TaskList = [];

    if(TaskListDataStr){
        TaskList = JSON.parse(TaskListDataStr);
    }

    // Création du nouvel identifiant

    let idTask = TaskList.length + 1;

    // Création du nouvel objet Task

    let newTask = {
        "idTask": idTask,
        "titleTask": titleTask,
        "descriptionTask": descriptionTask,
        "cv": cv,
        "dateDebut": dateDebut,
        "dateFin": dateFin,
        "idCategory": idCategory,
        "idStatus": idStatus,
        "idPhaseRealisation": idPhaseRealisation,
        "idPriority": idPriority
    };

    console.log(newTask);

    // Ajout de la nouvelle tâche

    TaskList.push(newTask);

    console.log(TaskList);

    // Conversion du tableau en JSON String

    let TaskListString = JSON.stringify(TaskList);

    // Enregistrement dans Local Storage

    localStorage.setItem("TaskList", TaskListString);

    // Réinitialisation du formulaire

    document.getElementById("taskForm").reset();

}
