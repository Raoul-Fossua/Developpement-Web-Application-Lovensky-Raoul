
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Do List - Étape 3A</title>

<style>
body {
font-family: Arial, sans-serif;
max-width: 700px;
margin: 20px auto;
padding: 15px;
}

label {
            display: block;
            margin-top: 15px;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 15px;
        }
    </style>

    <script>
        // Données des paramètres reprises de l'étape 1E

        let prioritiesList = [
            {"idPriority":1,"priorityName":"Important et urgent","validPriority":"1"},
            {"idPriority":2,"priorityName":"Important","validPriority":"1"},
            {"idPriority":3,"priorityName":"Urgent","validPriority":"1"},
            {"idPriority":4,"priorityName":"peu important","validPriority":"1"},
            {"idPriority":5,"priorityName":"faible priorité","validPriority":"1"}
        ];

        let categoriesList = [
            {"idCategory":1,"categoryName":"Recherche scientifique","validCategory":"1"},
            {"idCategory":2,"categoryName":"Gestion de projet","validCategory":"1"},
            {"idCategory":3,"categoryName":"Académique","validCategory":"1"},
            {"idCategory":4,"categoryName":"Travaux académiques et controle continu","validCategory":"1"},
            {"idCategory":5,"categoryName":"Portfolio et bilan de compétences","validCategory":"1"}
        ];

        let phaseRealisationList = [
            {"idPhaseRealisation":1,"idCategory":1,"phaseName":"Définition de la problématique et des hypothèses"},
            {"idPhaseRealisation":2,"idCategory":1,"phaseName":"Revue de littérature et méthodologie"},
            {"idPhaseRealisation":3,"idCategory":1,"phaseName":"Analyse des données et rédaction finale"},
            {"idPhaseRealisation":4,"idCategory":2,"phaseName":"Analyse du besoin et planification"},
            {"idPhaseRealisation":5,"idCategory":2,"phaseName":"Conception et réalisation"},
            {"idPhaseRealisation":6,"idCategory":2,"phaseName":"Évaluation et validation du projet"},
            {"idPhaseRealisation":7,"idCategory":3,"phaseName":"Définition des objectifs académiques"},
            {"idPhaseRealisation":8,"idCategory":3,"phaseName":"Réalisation des travaux universitaires"},
            {"idPhaseRealisation":9,"idCategory":3,"phaseName":"Finalisation et remise des travaux"},
            {"idPhaseRealisation":10,"idCategory":4,"phaseName":"Analyse de la consigne"},
            {"idPhaseRealisation":11,"idCategory":4,"phaseName":"Réalisation et vérification"},
            {"idPhaseRealisation":12,"idCategory":4,"phaseName":"Correction et dépôt du rendu"},
            {"idPhaseRealisation":13,"idCategory":5,"phaseName":"Recensement des compétences et réalisations"},
            {"idPhaseRealisation":14,"idCategory":5,"phaseName":"Constitution du portfolio"},
            {"idPhaseRealisation":15,"idCategory":5,"phaseName":"Bilan des compétences et valorisation"}
        ];

        let statusList = [
            {"idStatus":1,"statusName":"En cours"},
            {"idStatus":2,"statusName":"À faire"},
            {"idStatus":3,"statusName":"Terminé"},
            {"idStatus":4,"statusName":"En attente de validation"},
            {"idStatus":5,"statusName":"à augmenter / à diminuer"},
            {"idStatus":6,"statusName":"À revoir"},
            {"idStatus":7,"statusName":"À planifier"},
            {"idStatus":8,"statusName":"À déléguer"},
            {"idStatus":9,"statusName":"Annulé"}
        ];

        // Remplir une liste déroulante à partir des données
        function remplirListe(idListe, donnees, idElement, nomElement) {
            let liste = document.getElementById(idListe);

            donnees.forEach(function(element) {
                liste.insertAdjacentHTML(
                    "beforeend",
                    `<option value="${element[idElement]}">${element[nomElement]}</option>`
                );
            });
        }

        // Afficher les phases correspondant à la catégorie choisie
        function afficherPhases() {
            let idCategorie = Number(document.getElementById("idCategory").value);

            let listePhases = phaseRealisationList.filter(function(phase) {
                return phase.idCategory === idCategorie;
            });

            let selectPhase = document.getElementById("idphaseRealisation");
            selectPhase.innerHTML = '<option value="">Choisir une phase</option>';

            remplirListe(
                "idphaseRealisation",
                listePhases,
                "idPhaseRealisation",
                "phaseName"
            );
        }

        // Initialiser les listes après le chargement du document
        document.addEventListener("DOMContentLoaded", function() {
            remplirListe("idCategory", categoriesList, "idCategory", "categoryName");
            remplirListe("idPriority", prioritiesList, "idPriority", "priorityName");
            remplirListe("idStatus", statusList, "idStatus", "statusName");

            document.getElementById("idCategory").addEventListener(
                "change",
                afficherPhases
            );
        });
    </script>
</head>

<body>
    <h1>To Do List</h1>
    <h2>Ajouter une tâche</h2>

    <form id="formTache">
        <label for="titleTask">Titre de la tâche :</label>
        <input type="text" id="titleTask" name="titleTask" required>

        <label for="descriptionTask">Description :</label>
        <textarea id="descriptionTask" name="descriptionTask"></textarea>

        <label for="cv">Complément :</label>
        <textarea id="cv" name="cv"></textarea>

        <label for="dateDebut">Date de début :</label>
        <input type="date" id="dateDebut" name="dateDebut" required>

        <label for="dateFin">Date de fin :</label>
        <input type="date" id="dateFin" name="dateFin" required>

        <label for="idCategory">Catégorie :</label>
        <select id="idCategory" name="idCategory" required>
            <option value="">Choisir une catégorie</option>
        </select>

        <label for="idphaseRealisation">Phase de réalisation :</label>
        <select id="idphaseRealisation" name="idphaseRealisation" required>
            <option value="">Choisir d'abord une catégorie</option>
        </select>

        <label for="idPriority">Priorité :</label>
        <select id="idPriority" name="idPriority" required>
            <option value="">Choisir une priorité</option>
        </select>

        <label for="idStatus">Statut :</label>
        <select id="idStatus" name="idStatus" required>
            <option value="">Choisir un statut</option>
        </select>

        <button type="button" onclick="alert('Formulaire dynamique de l’étape 3A.')">
            Tester le formulaire
        </button>
    </form>
</body>
</html>
